name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show MinGW64 version
        run: x86_64-w64-mingw32-gcc --version
        shell: bash

      - name: Compile patcher core (MinGW64)
        run: x86_64-w64-mingw32-gcc -O2 -Wall -o gridd-unlock-patcher.exe gridd-unlock-patcher-mini.c
        shell: bash

      - name: Verify patcher core
        run: |
          echo "Patcher core size:"
          ls -la gridd-unlock-patcher.exe
          echo "Help output:"
          ./gridd-unlock-patcher.exe -h || true
        shell: bash

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -c "import tkinter; print('tkinter ok')"
          python -c "import PyInstaller; print('PyInstaller', PyInstaller.__version__)"

      - name: Package main program (PyInstaller)
        run: |
          python -m PyInstaller --onefile --windowed --uac-admin ^
            --name "NVIDIA_GRID_Driver_Patcher" ^
            --add-data "gridd-unlock-patcher.exe;." ^
            --distpath "dist" --workpath "build" --specpath "." ^
            patcher_gui.py
        shell: cmd

      - name: Prepare release artifacts
        run: |
          mkdir release
          move dist\NVIDIA_GRID_Driver_Patcher.exe release\
          copy gridd-unlock-patcher.exe release\
          rmdir /s /q build dist __pycache__ 2>nul
          del *.spec 2>nul
          dir release
        shell: cmd

      - name: Upload patcher core artifact
        uses: actions/upload-artifact@v4
        with:
          name: gridd-unlock-patcher
          path: release/gridd-unlock-patcher.exe

      - name: Upload main program artifact
        uses: actions/upload-artifact@v4
        with:
          name: main-program
          path: release/NVIDIA_GRID_Driver_Patcher.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download patcher core
        uses: actions/download-artifact@v4
        with:
          name: gridd-unlock-patcher
          path: release

      - name: Download main program
        uses: actions/download-artifact@v4
        with:
          name: main-program
          path: release

      - name: Verify artifacts
        run: |
          ls -la release/
          echo "Patcher: $(stat -c%s release/gridd-unlock-patcher.exe) bytes"
          echo "Main:    $(stat -c%s release/NVIDIA_GRID_Driver_Patcher.exe) bytes"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/NVIDIA_GRID_Driver_Patcher.exe
            release/gridd-unlock-patcher.exe
          generate_release_notes: true
          draft: false
          prerelease: false
